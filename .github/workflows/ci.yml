name: CI
# Every branch push runs the checks (pull requests show the run of their head commit). The push
# event carries the commit message, which the [vrt-update] baseline switch below relies on.
on:
  push:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run check -w catalog
      # Generated artifacts are committed so a token change shows its downstream diff; a stale
      # commit fails here.
      - name: Generated files in sync (DESIGN.md, DaisyUI themes)
        run: git diff --exit-code -- DESIGN.md packages/ui/src/styles/themes
      # impeccable anti-pattern scan of the built catalog (report-only until main scans clean;
      # then replace `exit 0` with `exit $code`). Exit 1 = the tool failed, which is an error.
      - name: Design anti-pattern scan (impeccable)
        run: |
          set +e
          npx --yes impeccable detect --json catalog/dist/ > impeccable.json
          code=$?
          npx --yes impeccable detect --quiet catalog/dist/
          set -e
          [ "$code" -ne 1 ] || { echo "::error::impeccable detect could not run"; exit 1; }
          echo "impeccable detect exit code: $code (report-only)"
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: impeccable-report
          path: impeccable.json
      - name: Accessibility (axe, serious and critical fail)
        run: |
          npx playwright install --with-deps chromium
          npm run test:a11y -w catalog
      # Baselines are generated only in this Linux image. A commit whose message contains
      # [vrt-update] regenerates them and uploads them as the "vrt-baselines" artifact; download
      # it into catalog/tests/__screenshots__ and commit (gh run download <run> -n vrt-baselines).
      - name: Regenerate VRT baselines
        if: contains(github.event.head_commit.message, '[vrt-update]')
        run: |
          npx playwright install --with-deps chromium
          npm run test:vrt:update -w catalog
      - uses: actions/upload-artifact@v7
        if: contains(github.event.head_commit.message, '[vrt-update]')
        with:
          name: vrt-baselines
          path: catalog/tests/__screenshots__
      - name: Visual regression (once baselines exist)
        if: ${{ !contains(github.event.head_commit.message, '[vrt-update]') && hashFiles('catalog/tests/__screenshots__/**') != '' }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:vrt -w catalog
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vrt-report
          path: catalog/test-results

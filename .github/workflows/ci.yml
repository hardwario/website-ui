name: CI
on:
  push:
    branches: [main, design-system]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run check -w catalog
      - name: Visual regression (once baselines exist)
        if: hashFiles('catalog/tests/__screenshots__/**') != ''
        run: |
          npx playwright install --with-deps chromium
          npm run test:vrt -w catalog
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vrt-report
          path: catalog/test-results

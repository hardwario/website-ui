name: VRT baselines
# Regenerates the catalog screenshots in CI's Linux image (never locally: text renders differently
# per OS) and commits them. Run after a deliberate visual change, then review the diff in the PR.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:vrt:update -w catalog
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/tests/__screenshots__
          git commit -m "catalog: update VRT baselines" || echo "no changes"
          git push
